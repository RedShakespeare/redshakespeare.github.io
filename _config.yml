# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Ephesus
subtitle: 
description: Roguelike Temple of Silencess
keywords: roguelike
author: Silencess
language: zh-Hans
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://www.ephesus.top/
permalink: :year/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - google1a76a4289e2a5783.html
  - files/rl/nethack/nh-helper/**
  - files/rl/angband/angband_manual/_/static/{css,javascript}/**
  - files/rl/angband/angband_manual/en/latest/**
  - files/rl/adom/adomgb/**
  - files/rl/moria/mmspoilers/**
  - files/rl/moria/monsearch/**
  - files/rl/moria/JSMoria/**
  - files/rl/rogue/EpyxRogueDosManual/**
  - files/rl/rogue/broken-connections/**
  - files/rl/rogue/JSRogue/**
  - files/rl/hack/JSHack/**
  - files/rl/larn/JSLarn/**
  - files/rl/larn/JSLarn12.5/**
  # Keep this shallow: JSomega/index.html needs Hexo to refresh hashed assets.
  - files/rl/omega/JSOmega/*
  - files/rl/omega/omega-help-file/**
  - files/rl/omega/omega-faq/**
  - lib/**
  - files/hxh_civ/**
  - files/leyliner/**
  - files/rl/poa/zh_CN/**
  - files/cataclysmIdle/**

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true 
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
## To republish an edited post to RSS, set its `updated` value in front matter.
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
  - "files/rl/angband/angband_manual/_/**"
  - "files/rl/angband/angband_manual/en/latest/_static/**"
exclude:
ignore:
  - '**/.DS_Store'

# Extensions

## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: inside
# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
suka_theme:
  search:
    enable: true
    path: search.json
    field: post # Page | Post | All. Default post
  prism:
    enable: false
    line_number: true
    theme: default
sitemap:
  path: ep-sitemap.xml
feed:
  type: atom
  path: atom.xml
  limit: 25
  icon: favicon.png
assets:
  # The manifest's state switches the deployment from the legacy mirror to R2 after npm run assets:migrate -- --finalize.
  manifest: source/_data/assets.json
audio:
  assets:
    enabled: true
  media:
    prefix: files
    # source_dir: files
    # url: https://media.example.com/files/
  skin:
    builtin: ephesus
    # Loaded after the built-in skin. Set builtin to false for a fully custom skin.
    # override: /css/hexo-sil-audio.local.css
archive:
  # hexo-sil-archive: searchable file collections rendered with the {% archive %} tag.
  assets:
    enabled: true
  skin:
    builtin: ephesus
    # override: /css/hexo-sil-archive.local.css
  # Tag arguments override collection settings, which override these defaults.
  defaults:
    prefix: files
    title: 搜索...
    placeholder: 输入文件名或目录名
    hint: 支持搜索文件名和目录名称
  collections:
    hxh-civ:
      prefix: files/hxh_civ
podcast:
  # hexo-sil-podcast: preview article players first. Set to false only when ready to publish podcast.xml.
  dry_run: true
  # hexo-sil-podcast-inside: set false to hide the Podcasts menu and disable its Inside list integration.
  inside:
    enabled: true
  path: podcast.xml
  title: Ephesus
  description: Roguelike Temple of Silencess
  author: Silencess
  email: silencess.m@gmail.com
  language: zh-CN
  link: /
  # Temporary 500px icon. Replace with a 1400-3000px square cover before submission.
  image: favicon.png
  category:
    text: Leisure
    subcategory: Games
  assets:
    enabled: true
  media:
    # prefix defaults to audio.media.prefix.
    # source_dir: files
    # url: https://media.example.com/files/
  explicit: false
  # 0 keeps the full published episode catalogue in the podcast feed.
  limit: 0
