name: Deploy files proxy Worker

on:
  push:
    branches: [ "src" ]
    paths:
      - "workers/ephesus-files-proxy/**"
      - ".github/workflows/deploy-files-worker.yml"
  workflow_dispatch:

concurrency:
  group: ephesus-files-proxy-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout src
        uses: actions/checkout@v4
        with:
          ref: src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Worker
        working-directory: workers/ephesus-files-proxy
        run: node --test test/index.test.js

      - name: Deploy Worker
        working-directory: workers/ephesus-files-proxy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
